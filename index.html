<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10090c">
  <title>Der Saal — Ein Spiel im großen Kino</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #e8c486;
      --cream: #f5e9d4;
      --wine: #641927;
      --deep-wine: #310d18;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--cream);
      background: #10090c;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .theater {
      position: relative;
      display: grid;
      min-height: 100svh;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(180deg, rgba(15, 7, 11, .45), rgba(15, 7, 11, .2) 45%, rgba(12, 5, 8, .88)),
        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=2400&q=85') center 46% / cover,
        #241116;
    }

    .theater::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: '';
      background: radial-gradient(ellipse at 50% 46%, transparent 12%, rgba(8, 3, 5, .2) 56%, rgba(8, 3, 5, .77) 100%);
    }

    .topbar, .credits {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 27px clamp(20px, 5vw, 76px);
    }

    .brand {
      color: var(--gold);
      font-size: .78rem;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(255, 242, 222, .76);
      font: 500 .68rem/1.2 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #bcdf9c;
      box-shadow: 0 0 12px #bcdf9c;
      content: '';
    }

    main {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(20px, 4vh, 38px);
      padding: 16px 22px 40px;
    }

    .intro { text-align: center; text-shadow: 0 2px 20px #000; }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--gold);
      font: 500 .68rem/1.4 Arial, sans-serif;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #fff3df;
      font-size: clamp(2rem, 5vw, 4.1rem);
      font-weight: 400;
      letter-spacing: .055em;
    }
    .subtitle {
      margin: 10px 0 0;
      color: rgba(255, 239, 216, .78);
      font: 400 .88rem/1.5 Arial, sans-serif;
      letter-spacing: .08em;
    }

    .screen-frame {
      position: relative;
      width: min(76vw, 1040px);
      aspect-ratio: 16 / 9;
      padding: clamp(7px, 1.1vw, 14px);
      border: 1px solid rgba(238, 204, 148, .72);
      background: linear-gradient(135deg, #5c351e, #d0a866 20%, #48271b 48%, #b98b4e 78%, #382015);
      box-shadow: 0 0 0 4px rgba(34, 14, 12, .9), 0 0 0 5px rgba(229, 188, 121, .5), 0 22px 90px rgba(0, 0, 0, .8), 0 0 100px rgba(234, 185, 112, .14);
    }

    .screen-frame::before, .screen-frame::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      width: 9px;
      height: 9px;
      border: 1px solid rgba(255, 226, 173, .9);
      border-radius: 50%;
      background: #a8783e;
      box-shadow: 0 0 10px rgba(255, 213, 147, .8);
      content: '';
    }
    .screen-frame::before { left: 3px; }
    .screen-frame::after { right: 3px; }

    .game-screen {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #261e24, #09080b 76%);
      box-shadow: inset 0 0 40px #000;
    }

    /* Replace this placeholder with your WebGL canvas or game container. */
    .game-screen canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .placeholder {
      padding: 20px;
      color: rgba(245, 233, 212, .62);
      text-align: center;
      font: 500 .72rem/1.8 Arial, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .placeholder strong {
      display: block;
      margin-bottom: 5px;
      color: var(--gold);
      font: 400 clamp(1.05rem, 2.4vw, 1.6rem)/1.3 Georgia, serif;
      letter-spacing: .16em;
    }

    .curtain {
      position: absolute;
      z-index: 1;
      top: 19%;
      bottom: 21%;
      width: max(8%, 80px);
      pointer-events: none;
      background: repeating-linear-gradient(90deg, #4b101b 0 10px, #721e2b 13px 22px, #45101a 28px 34px);
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .65));
    }
    .curtain.left {
      left: 0;
      border-right: 2px solid rgba(211, 166, 100, .55);
      border-radius: 0 0 100% 0 / 0 0 20% 0;
      clip-path: polygon(0 0, 100% 0, 87% 14%, 100% 30%, 87% 48%, 100% 68%, 86% 86%, 96% 100%, 0 100%);
    }
    .curtain.right {
      right: 0;
      border-left: 2px solid rgba(211, 166, 100, .55);
      border-radius: 0 0 0 100% / 0 0 0 20%;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 4% 100%, 14% 86%, 0 68%, 13% 48%, 0 30%, 13% 14%);
    }

    .credits {
      color: rgba(255, 237, 211, .68);
      font: 500 .65rem/1.4 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .credits span:last-child { color: var(--gold); }

    @media (max-width: 700px) {
      .theater { min-height: 100svh; background-position: center; }
      .topbar, .credits { padding: 20px; }
      .brand { font-size: .66rem; letter-spacing: .2em; }
      .status { font-size: .58rem; letter-spacing: .1em; }
      main { gap: 25px; padding: 20px 14px 38px; }
      .screen-frame { width: min(88vw, 1040px); }
      .curtain { width: 9%; }
      .credits { font-size: .55rem; letter-spacing: .08em; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .theater { animation: fade-in 1.2s ease-out both; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <div class="theater">
    <header class="topbar">
      <div class="brand">Das Lichtspielhaus</div>
      <div class="status">Vorstellung läuft</div>
    </header>

    <main>
      <div class="intro">
        <p class="eyebrow">Ein besonderes Erlebnis</p>
        <h1>Der große Saal</h1>
        <p class="subtitle">Nehmen Sie Platz. Die Vorstellung beginnt.</p>
      </div>

      <section class="screen-frame" aria-label="Leinwand mit WebGL-Spiel">
        <div class="game-screen" id="game-container">
          <div class="placeholder">
            <strong>Ihre Leinwand</strong>
            WebGL-Spiel hier einfügen
          </div>
          <!-- Beispiel: <canvas id="game-canvas"></canvas> -->
        </div>
      </section>
    </main>

    <div class="curtain left" aria-hidden="true"></div>
    <div class="curtain right" aria-hidden="true"></div>

    <footer class="credits">
      <span>Ein Abend im alten Kino</span>
      <span>Bitte genießen Sie die Vorstellung</span>
    </footer>
  </div>
</body>
</html>
